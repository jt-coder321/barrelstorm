name: Build APK and publish release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build number = workflow run number. The in-app updater compares it with the installed versionCode.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bundle the game
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Android only installs an update that is signed with the same key as the installed app, so every
      # release must use the same private key. It lives in repository secrets (see README.md, "Signing key"):
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Load signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BARRELSTORM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BARRELSTORM_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "BARRELSTORM_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "BARRELSTORM_KEY_PASSWORD=${KS_KEY_PASS:-$KS_PASS}" >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets"
          elif [ "$IS_RELEASE" = "true" ]; then
            echo "::error::No signing key. Add the ANDROID_KEYSTORE_* repository secrets (see README.md, Signing key). Publishing an APK signed with a throwaway key would break updates."
            exit 1
          else
            echo "::warning::No signing key secrets found. This test build uses a throwaway debug key and is not published."
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "barrelstorm-v${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: barrelstorm-apk
          path: barrelstorm-v*.apk

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > "$RUNNER_TEMP/notes.txt"
          gh release create "v${VERSION_NAME}" "barrelstorm-v${VERSION_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "Barrelstorm ${VERSION_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            --latest
